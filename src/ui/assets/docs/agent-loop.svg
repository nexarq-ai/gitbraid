<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" fill="none" role="img" aria-labelledby="title desc"><title id="title">External AI clients and task agents have separate authority</title><desc id="desc">An external AI client reads repository evidence, plans two tasks, and requests only user-authorized actions through MCP with the principal role and scope. Runtime agents execute isolated tasks with bounded tools, fork access, and gateway inference. They do not inherit owner authority.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#7d8b99" stroke-width="1.5"/></marker></defs><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="20" y="20" width="600" height="80" rx="7" fill="#fff3e8" stroke="#e39c60"/><text x="320.0" y="50" font-size="16" font-weight="600" fill="#26313d">External AI client</text><text x="320.0" y="75" font-size="13" fill="#596878">Current user role + repository scope</text><path d="M140 100v34" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M320 100v34" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M500 100v34" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="135" width="180" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="110.0" y="165" font-size="16" font-weight="600" fill="#26313d">Read</text><text x="110.0" y="190" font-size="13" fill="#596878">Pin source + evidence</text><rect x="230" y="135" width="180" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="320.0" y="165" font-size="16" font-weight="600" fill="#26313d">Plan</text><text x="320.0" y="190" font-size="13" fill="#596878">Outcome + two tasks</text><rect x="440" y="135" width="180" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="530.0" y="165" font-size="16" font-weight="600" fill="#26313d">Act within scope</text><text x="530.0" y="190" font-size="13" fill="#596878">Draft / start / review</text><path d="M530 215v29H320v29" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><text x="438" y="242" font-size="12" fill="#596878">Authorized start</text><rect x="90" y="275" width="460" height="102" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="320.0" y="305" font-size="16" font-weight="600" fill="#26313d">Runtime task agents</text><text x="320.0" y="330" font-size="13" fill="#596878">Own forks + bounded shell + AI Gateway</text><text x="320.0" y="352" font-size="13" fill="#596878">No owner token, approval tools or canonical credentials</text></g></svg>
