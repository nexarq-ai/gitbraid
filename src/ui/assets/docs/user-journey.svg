<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" fill="none" role="img" aria-labelledby="title desc"><title id="title">The workspace review journey</title><desc id="desc">Sign in and select a repository. Draft a Stream with an outcome, criteria and two tasks. Starting execution creates isolated work. Review recorded diffs and checks, approve the exact candidate, and separately land changes when authorized. Live end-to-end execution proof is pending.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#7d8b99" stroke-width="1.5"/></marker></defs><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><path d="M195 62h27" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M417 62h27" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M532 120v58" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M442 231h-26" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M221 231h-26" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="20" width="175" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="107.5" y="50" font-size="16" font-weight="600" fill="#26313d">Sign in</text><text x="107.5" y="75" font-size="13" fill="#596878">Workspace membership</text><rect x="222" y="20" width="195" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="319.5" y="50" font-size="16" font-weight="600" fill="#26313d">Choose repository</text><text x="319.5" y="75" font-size="13" fill="#596878">Browse a pinned revision</text><rect x="444" y="20" width="175" height="102" rx="7" fill="#fff3e8" stroke="#e39c60"/><text x="531.5" y="50" font-size="16" font-weight="600" fill="#26313d">Draft Stream</text><text x="531.5" y="75" font-size="13" fill="#596878">Outcome + criteria</text><text x="531.5" y="97" font-size="13" fill="#596878">Exactly two tasks</text><rect x="444" y="178" width="175" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="531.5" y="208" font-size="16" font-weight="600" fill="#26313d">Start execution</text><text x="531.5" y="233" font-size="13" fill="#596878">Two isolated forks</text><rect x="222" y="178" width="195" height="80" rx="7" fill="#fff3e8" stroke="#e39c60"/><text x="319.5" y="208" font-size="16" font-weight="600" fill="#26313d">Review evidence</text><text x="319.5" y="233" font-size="13" fill="#596878">Diffs + candidate checks</text><rect x="20" y="178" width="175" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="107.5" y="208" font-size="16" font-weight="600" fill="#26313d">Approve candidate</text><text x="107.5" y="233" font-size="13" fill="#596878">Exact base + revision</text><path d="M107 258v47" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="306" width="599" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="319.5" y="336" font-size="16" font-weight="600" fill="#26313d">Land changes separately</text><text x="319.5" y="361" font-size="13" fill="#596878">Requires landing authority and unchanged canonical head</text><text x="320" y="420" font-size="13" fill="#596878">Implemented workflow · live model-backed completion remains unverified</text></g></svg>
