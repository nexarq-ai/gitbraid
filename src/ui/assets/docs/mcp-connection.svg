<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" fill="none" role="img" aria-labelledby="title desc"><title id="title">An authenticated MCP request</title><desc id="desc">A trusted AI client supplies an OAuth access token to the Cloudflare Worker MCP endpoint. The official Agents SDK handler dispatches tools using shared authorization and mission state guards. Replies contain permitted state or a useful error. The deployed OAuth protocol has been verified; actual Codex or Claude application sessions remain unverified.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#7d8b99" stroke-width="1.5"/></marker></defs><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="20" y="20" width="180" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="110.0" y="50" font-size="16" font-weight="600" fill="#26313d">Trusted AI client</text><text x="110.0" y="75" font-size="13" fill="#596878">OAuth access token</text><path d="M200 61h28" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="230" y="20" width="390" height="80" rx="7" fill="#fff3e8" stroke="#e39c60"/><text x="425.0" y="50" font-size="16" font-weight="600" fill="#26313d">Worker MCP endpoint</text><text x="425.0" y="75" font-size="13" fill="#596878">Official Agents SDK createMcpHandler</text><path d="M425 100v34" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="230" y="135" width="390" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="425.0" y="165" font-size="16" font-weight="600" fill="#26313d">Shared authorization</text><text x="425.0" y="190" font-size="13" fill="#596878">Security DO: session, role and repository scope</text><path d="M425 215v34" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="230" y="250" width="390" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="425.0" y="280" font-size="16" font-weight="600" fill="#26313d">Application action</text><text x="425.0" y="305" font-size="13" fill="#596878">Same validation and state checks as UI</text><path d="M230 290H35V100" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><text x="115" y="199" font-size="12" fill="#596878">Permitted reply / error</text><text x="320" y="365" font-size="13" fill="#596878">OAuth authorization and client connection are separate checks</text></g></svg>
