<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 534" fill="none" role="img" aria-labelledby="title desc"><title id="title">Two task results become one tested candidate</title><desc id="desc">Exactly two task forks execute concurrently and undergo individual verification. Their results merge into one candidate and run combined checks. A passing exact candidate can be approved and landed by authorized principals. Failure or cancellation records evidence and cannot become a passing check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" stroke="#7d8b99" stroke-width="1.5"/></marker></defs><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><rect x="20" y="20" width="180" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="110.0" y="50" font-size="16" font-weight="600" fill="#26313d">Pinned base</text><text x="110.0" y="75" font-size="13" fill="#596878">Attempt epoch + criteria</text><path d="M200 60h52v60" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 60h344v60" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="165" y="121" width="200" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="265.0" y="151" font-size="16" font-weight="600" fill="#26313d">Task A</text><text x="265.0" y="176" font-size="13" fill="#596878">Own fork + fresh checks</text><rect x="415" y="121" width="200" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="515.0" y="151" font-size="16" font-weight="600" fill="#26313d">Task B</text><text x="515.0" y="176" font-size="13" fill="#596878">Own fork + fresh checks</text><path d="M265 201v28h-58v34" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M515 201v28H207" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="90" y="266" width="235" height="80" rx="7" fill="#fff3e8" stroke="#e39c60"/><text x="207.5" y="296" font-size="16" font-weight="600" fill="#26313d">Combined candidate</text><text x="207.5" y="321" font-size="13" fill="#596878">Fresh tests on exact SHA</text><path d="M325 306h48" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="293" font-size="12" fill="#596878">Pass</text><rect x="375" y="266" width="240" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="495.0" y="296" font-size="16" font-weight="600" fill="#26313d">Exact-candidate approval</text><text x="495.0" y="321" font-size="13" fill="#596878">Role + policy + base SHA</text><path d="M495 346v28" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="375" y="376" width="240" height="80" rx="7" fill="#fff" stroke="#cbd3dc"/><text x="495.0" y="406" font-size="16" font-weight="600" fill="#26313d">Trusted landing</text><text x="495.0" y="431" font-size="13" fill="#596878">Expected-head lease</text><path d="M207 346v28" stroke="#7d8b99" stroke-width="1.5" marker-end="url(#arrow)"/><text x="208" y="363" font-size="12" fill="#596878">Failure / cancellation</text><rect x="90" y="376" width="235" height="80" rx="7" fill="#fff" stroke="#cbd3dc" stroke-dasharray="5 4"/><text x="207.5" y="406" font-size="16" font-weight="600" fill="#26313d">Record useful failure</text><text x="207.5" y="431" font-size="13" fill="#596878">Reject late epoch reports</text><text x="320" y="511" font-size="13" fill="#596878">Implemented execution path · complete live proof remains pending</text></g></svg>
