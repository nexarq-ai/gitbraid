<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 492" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Gitflare architecture</title>
<desc id="desc">The browser and MCP clients enter one Worker control plane. A Security Durable Object checks access, a Coordinator Durable Object manages mission state, Workflows dispatch isolated Containers, Artifacts stores repository Streams, and Container inference uses AI Gateway gitflare with the two allowed models.</desc>
